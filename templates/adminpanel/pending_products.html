{% extends 'base.html' %}

{% block content %}

<h2>Pending Products</h2>

<table class="table table-bordered">

    <tr>
        <th>Product</th>
        <th>Seller</th>
        <th>Price</th>
        <th>Status</th>
    </tr>

    {% for product in products %}

    <tr>

        <td>{{ product.product_name }}</td>

        <td>{{ product.seller.username }}</td>

        <td>₹{{ product.price }}</td>

        <td>{{ product.status }}</td>

    </tr>

    {% empty %}

    <tr>

        <td colspan="4">
            No Pending Products
        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
