{% extends 'base.html' %}

{% block title %}
Edit Product
{% endblock %}

{% block content %}

<div class="container">

    <div class="glass p-5">

        <h2 class="gradient-text text-center mb-4">

            Edit Product

        </h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="btn pastel-btn w-100">

                <i class="fa-solid fa-floppy-disk me-2"></i>

                Update Product

            </button>

        </form>

    </div>

</div>

{% endblock %}
